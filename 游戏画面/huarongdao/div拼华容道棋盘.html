<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="huarongdao_styles.css">
    </head>
    <body>
        <div>
            <h1 style="margin:auto;color:brown;">
                Huarongdao
            </h1>
            <p style="margin:auto;color:blue;">
                Level 1
                <br>
                Time: xx Step: xx
            </p>
        </div>
        <div class="board">
            <div class="piece-soldier" style="top: 0;left: 0;">
                <img src="soldier.png" alt="soldier">
            </div>
            <div class="piece-high-general" style="top: 100px;left: 0;">
                <img src="zhaoyun.png" alt="zhaoyun">
            </div>
            <div class="piece-high-general" style="top: 300px;left: 0;">
                <img src="huangzhong.png" alt="huangzhong">
            </div>
            <div class="piece-king" style="top: 0;left: 100px;">
                <img src="caocao.png" alt="caocao">
            </div>
            <div class="piece-soldier" style="top: 200px;left: 100px;">
                <img src="soldier.png" alt="soldier">
            </div>
            <div class="piece-soldier" style="top: 200px;left: 200px;">
                <img src="soldier.png" alt="soldier">
            </div>
            <div class="piece-wide-general" style="top: 300px;left: 100px;">
                <img src="guanyu.png" alt="guanyu">
            </div>
            <div class="piece-soldier" style="top: 0;right: 0;">
                <img src="soldier.png" alt="soldier">
            </div>
            <div class="piece-high-general" style="top: 100px;right:0">
                <img src="zhangfei.png" alt="zhangfei">
            </div>
            <div class="piece-high-general" style="bottom: 0;right: 0;">
                <img src="zhaoyun.png" alt="zhaoyun">
            </div>
        </div>
        <div class="bottom-part">
            <div class="button" style="left: 0;">
                reset
            </div>
            <div class="button" style="left: 100px;">
                back
            </div>
            <div class="button" style="left: 200px;">
                levels
            </div>
            <div class="button" style="left: 300px;">
                home
            </div>
        </div>
    </body>
</html>

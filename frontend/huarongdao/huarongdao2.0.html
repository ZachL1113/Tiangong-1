<!DOCTYPE html>
<html>

<head>
    <title>游戏样例</title>
    <!-- <script type="module" src="../js/backend.js"></script> -->
    <style>
        :root {
            --piece-size: 10vmin;
            --piece-count-width: 9;
            --piece-count-height: 9;
            --in-debug-mode: 0;
        }

        #board {
            width: calc((var(--piece-count-width)) * var(--piece-size) * (1 + var(--in-debug-mode)));
            height: calc((var(--piece-count-height)) * var(--piece-size));
            border: 5px solid black;
            position: relative;
            overflow: hidden;
        }

        .board>div {
            position: absolute;
            top: 50px;
            left: calc((var(--piece-count-height)) * var(--piece-size));
            background-color: burlywood;
            width: 100px;
            height: 100px;
            border: 2px solid black;
        }

        .board>.y0 {
            top: 0;
        }

        .board>.y1 {
            top: calc(var(--piece-size));
        }

        .board>.y2 {
            top: calc(var(--piece-size) * 2);
        }

        .board>.y3 {
            top: calc(var(--piece-size) * 3);
        }

        .board>.y4 {
            top: calc(var(--piece-size) * 4);
        }

        .board>.y5 {
            top: calc(var(--piece-size) * 5);
        }

        .board>.y6 {
            top: calc(var(--piece-size) * 6);
        }

        .board>.y7 {
            top: calc(var(--piece-size) * 7);
        }

        .board>.y8 {
            top: calc(var(--piece-size) * 8);
        }

        .board>.x0 {
            left: 0;
        }

        .board>.x1 {
            left: calc(var(--piece-size));
        }

        .board>.x2 {
            left: calc(var(--piece-size) * 2);
        }

        .board>.x3 {
            left: calc(var(--piece-size) * 3);
        }

        .board>.x4 {
            left: calc(var(--piece-size) * 4);
        }

        .board>.x5 {
            left: calc(var(--piece-size) * 5);
        }

        .board>.x6 {
            left: calc(var(--piece-size) * 6);
        }

        .board>.x7 {
            left: calc(var(--piece-size) * 7);
        }

        .board>.x8 {
            left: calc(var(--piece-size) * 8);
        }

        .board>.w1 {
            width: calc(var(--piece-size) - 2px);
        }

        .board>.w2 {
            width: calc(var(--piece-size) * 2 - 2px);
        }

        .board>.h1 {
            height: calc(var(--piece-size) - 2px);
        }

        .board>.h2 {
            height: calc(var(--piece-size) * 2 - 2px);
        }
    </style>
</head>

<body>
    <div id="game">
        <div id="board" class="board">
        </div>
    </div>
    <script>
        const gameTypeConfig = {
            '2048': {
                attrs: {
                    "--piece-size": "22.5vmin",
                    "--piece-count-width": 4,
                    "--piece-count-height": 4
                },
                pieceCount: 16,
                pieceCountWidth: 4
            },
            'huarongdao': {
                attrs: {
                    "--piece-size": "18vmin",
                    "--piece-count-width": 4,
                    "--piece-count-height": 5
                },
                pieceCount: 10,
                pieceCountWidth: 4
            },
            'sudoku': {
                attrs: {
                    "--piece-size": "10vmin",
                    "--piece-count-width": 9,
                    "--piece-count-height": 9
                },
                pieceCount: 81,
                pieceCountWidth: 9
            }
        }
        const pieces = [];
        const urlParams = new URLSearchParams(window.location.search);
        const level = parseInt(urlParams.get('level')) || 0;
        const game = urlParams.get('game');
        console.log(game, level)
        changeGameType(game)

        // 改变游戏类型
        function changeGameType(game) {
            if (!['2048', 'huarongdao', 'sudoku'].includes(game)) {
                return;
            }
            currentBoard = {"pieces":[{"id":0,"name":"guanyu","w":2,"h":1,"x":2,"y":0},{"id":1,"name":"soldier","w":1,"h":1,"x":2,"y":3},{"id":2,"name":"soldier","w":1,"h":1,"x":3,"y":3},{"id":3,"name":"soldier","w":1,"h":1,"x":2,"y":4},{"id":4,"name":"soldier","w":1,"h":1,"x":3,"y":4},{"id":5,"name":"huangzhong","w":2,"h":1,"x":2,"y":2},{"id":6,"name":"machao","w":1,"h":2,"x":0,"y":1},{"id":7,"name":"zhaoyun","w":1,"h":2,"x":1,"y":1},{"id":8,"name":"zhangfei","w":2,"h":1,"x":0,"y":0},{"id":9,"name":"caocao","w":2,"h":2,"x":0,"y":3}],"score":0,"cells":[[8,6,6,9,9],[8,7,7,9,9],[0,0,5,1,3],[0,0,5,2,4]]};
            //getNewGame(game, level).then(data => {
                //console.log(game, level);
                //currentBoard = data;
            //});
            // 清空棋盘
            const board = document.getElementById("board");
            board.innerHTML = "";
            pieces.length = 0;
            // 重置棋盘类型
            board.classList.remove('2048', 'huarongdao', 'sudoku');
            board.classList.add(game);

            // 修改棋子数量及大小参数
            const attrs = gameTypeConfig[game].attrs;
            for (const attr in attrs) {
                document.documentElement.style.setProperty(attr, attrs[attr]);
            }
            // 重置棋子
            const X = gameTypeConfig[game].pieceCountWidth;
            const pieceCount = gameTypeConfig[game].pieceCount;
            for (let i = 0; i < pieceCount; i++) {
                const piece = document.createElement("div");
                piece.classList.add("piece");
                board.appendChild(piece);
                pieces.push(piece);

                if (game !== 'huarongdao') {
                    // 数独与2048都是规则棋盘可以统一处理
                    piece.classList.add("w1", "h1", `x${i % X}`, `y${Math.floor(i / X)}`);
                }
            }
            // 华容道的盘面涉及不一样的大小和不规律的位置乃至图片，需要单独处理
            if (game === 'huarongdao') {
                //xywh
                currentBoard.pieces.forEach(currentPiece => {
                    const p = pieces[currentPiece.id]
                    p.classList.add(`x${currentPiece.x}`, `y${currentPiece.y}`, `w${currentPiece.w}`, `h${currentPiece.h}`);
                    
                    p.style.backgroundSize = "100% 100%"
                    if (currentPiece.w === 1 && currentPiece.h === 2) {
                        p.style.backgroundImage = `url("../image/${currentPiece.name}_h.png")`;
                        console.log(`../image/${currentPiece.name}_h.png`)
                    } else if (currentPiece.w === 2 && currentPiece.h === 1) {
                        p.style.backgroundImage = `url("../image/${currentPiece.name}_w.png")`;
                        console.log(`../image/${currentPiece.name}_w.png`)
                    } else {
                        p.style.backgroundImage = `url("../image/${currentPiece.name}.png")`;
                        console.log(`../image/${currentPiece.name}.png`)
                    }
                });
            }
        }

    </script>
</body>

</html>

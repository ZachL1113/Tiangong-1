<!DOCTYPE html>
<html>

<head>
    <title>游戏样例</title>
    <!-- <script type="module" src="../js/backend.js"></script> -->
    <style>
        :root {
            --piece-size: 10vmin;
            --piece-count-width: 9;
            --piece-count-height: 9;
            --in-debug-mode: 0;
        }

        #board {
            width: calc((var(--piece-count-width)) * var(--piece-size) * (1 + var(--in-debug-mode)));
            height: calc((var(--piece-count-height)) * var(--piece-size));
            border: 5px solid black;
            position: relative;
            overflow: hidden;
        }

        .board>div {
            position: absolute;
            top: 50px;
            left: calc((var(--piece-count-height)) * var(--piece-size));
            background-color: burlywood;
            width: 100px;
            height: 100px;
            border: 2px solid black;
        }

        .board>.y0 {
            top: 0;
        }

        .board>.y1 {
            top: calc(var(--piece-size));
        }

        .board>.y2 {
            top: calc(var(--piece-size) * 2);
        }

        .board>.y3 {
            top: calc(var(--piece-size) * 3);
        }

        .board>.y4 {
            top: calc(var(--piece-size) * 4);
        }

        .board>.y5 {
            top: calc(var(--piece-size) * 5);
        }

        .board>.y6 {
            top: calc(var(--piece-size) * 6);
        }

        .board>.y7 {
            top: calc(var(--piece-size) * 7);
        }

        .board>.y8 {
            top: calc(var(--piece-size) * 8);
        }

        .board>.x0 {
            left: 0;
        }

        .board>.x1 {
            left: calc(var(--piece-size));
        }

        .board>.x2 {
            left: calc(var(--piece-size) * 2);
        }

        .board>.x3 {
            left: calc(var(--piece-size) * 3);
        }

        .board>.x4 {
            left: calc(var(--piece-size) * 4);
        }

        .board>.x5 {
            left: calc(var(--piece-size) * 5);
        }

        .board>.x6 {
            left: calc(var(--piece-size) * 6);
        }

        .board>.x7 {
            left: calc(var(--piece-size) * 7);
        }

        .board>.x8 {
            left: calc(var(--piece-size) * 8);
        }

        .board>.w1 {
            width: calc(var(--piece-size) - 2px);
        }

        .board>.w2 {
            width: calc(var(--piece-size) * 2 - 2px);
        }

        .board>.h1 {
            height: calc(var(--piece-size) - 2px);
        }

        .board>.h2 {
            height: calc(var(--piece-size) * 2 - 2px);
        }
    </style>
</head>

<body>
    <div id="game">
        <div id="board" class="board">
        </div>
    </div>
    <script>
        const BASE_URL = 'http://127.0.0.1:8080';
        /** 
        * @param {string} game
        * @param {number} [level]
        * @returns {Promise<Object>}
        */
        async function getNewGame(game, level = null) {
            let uri = `/games/${game}/new`;
            if (game === 'huarongdao' && level !== null) {
                uri += `?level=${level}`;
            }
            return await getData(uri);
        }

        /**
         * 发送用户移动操作
         * @param {string} game - 游戏名，如 "2048" 或 "huarongdao"
         * @param {string} boardJson - 当前棋盘状态（JSON 字符串）
         * @param {string} direction - 方向：U / D / L / R（或 W/A/S/D）
         * @param {number} pieceId - 棋子编号（仅部分游戏使用）
         * @returns {Promise<Object>} 返回 { boardJson, valid, success }
         */

        async function sendMove(game, boardJson, direction, pieceId) {
            return await postData(`/games/${game}/move`, {
                boardJson,
                direction,
                pieceId,
            });
        }

        async function getData(uri) {
            try {
                const response = await fetch(BASE_URL + uri);
                if (!response.ok) throw new Error('网络响应不正常');
                return await response.json();
            } catch (error) {
                console.error('获取数据失败:', error);
                throw error;
            }
        }

        async function postData(uri, params) {
            try {
                const response = await fetch(BASE_URL + uri, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(params),
                });
                if (!response.ok) throw new Error('网络响应不正常');
                return await response.json();
            } catch (error) {
                console.error('发送数据失败:', error);
                throw error;
            }
        }
        const gameTypeConfig = {
            '2048': {
                attrs: {
                    "--piece-size": "22.5vmin",
                    "--piece-count-width": 4,
                    "--piece-count-height": 4
                },
                pieceCount: 16,
                pieceCountWidth: 4
            },
            'huarongdao': {
                attrs: {
                    "--piece-size": "18vmin",
                    "--piece-count-width": 4,
                    "--piece-count-height": 5
                },
                pieceCount: 10,
                pieceCountWidth: 4
            },
            'sudoku': {
                attrs: {
                    "--piece-size": "10vmin",
                    "--piece-count-width": 9,
                    "--piece-count-height": 9
                },
                pieceCount: 81,
                pieceCountWidth: 9
            }
        }
        let currentBoard = null;
        const pieces = [];
        const urlParams = new URLSearchParams(window.location.search);
        const level = parseInt(urlParams.get('level')) || 0;
        const game = urlParams.get('game');
        console.log(game, level)

        // 改变游戏类型
        async function changeGameType(game, level) {
            if (!['2048', 'huarongdao', 'sudoku'].includes(game)) return;

            // 获取游戏数据（确保异步完成）
            currentBoard = await getNewGame(game, level);

            if (!currentBoard || !currentBoard.pieces) {
                console.error("currentBoard 加载失败：", currentBoard);
                return;
            }

            // 以下是初始化渲染逻辑
            const board = document.getElementById("board");
            board.innerHTML = "";
            pieces.length = 0;

            board.classList.remove('2048', 'huarongdao', 'sudoku');
            board.classList.add(game);

            const attrs = gameTypeConfig[game].attrs;
            for (const attr in attrs) {
                document.documentElement.style.setProperty(attr, attrs[attr]);
            }

            const X = gameTypeConfig[game].pieceCountWidth;
            const pieceCount = gameTypeConfig[game].pieceCount;

            for (let i = 0; i < pieceCount; i++) {
                const piece = document.createElement("div");
                piece.classList.add("piece");
                board.appendChild(piece);
                pieces.push(piece);

                if (game !== 'huarongdao') {
                    piece.classList.add("w1", "h1", `x${i % X}`, `y${Math.floor(i / X)}`);
                }
            }

            if (game === 'huarongdao') {
                currentBoard.pieces.forEach(currentPiece => {
                    const p = pieces[currentPiece.id];
                    if (!p) return;

                    p.classList.add(`x${currentPiece.x}`, `y${currentPiece.y}`, `w${currentPiece.w}`, `h${currentPiece.h}`);
                    p.style.backgroundSize = "100% 100%";

                    if (currentPiece.w === 1 && currentPiece.h === 2) {
                        p.style.backgroundImage = `url("../image/${currentPiece.name}_h.png")`;
                    } else if (currentPiece.w === 2 && currentPiece.h === 1) {
                        p.style.backgroundImage = `url("../image/${currentPiece.name}_w.png")`;
                    } else {
                        p.style.backgroundImage = `url("../image/${currentPiece.name}.png")`;
                    }
                });
            }
        }
        (async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const level = parseInt(urlParams.get('level')) || 0;
            const game = urlParams.get('game');
            await changeGameType(game, level);
        })();

    </script>
</body>

</html>

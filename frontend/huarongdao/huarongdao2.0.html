<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Board King</title>
    <!-- <script type="module" src="../js/backend.js"></script> -->
    <style>
        :root {
            --piece-size: 10vmin;
            --piece-count-width: 9;
            --piece-count-height: 9;
            --in-debug-mode: 0;
        }

        body {
            align-items: center;
            justify-content: center;
            display: flex;
            flex-direction: row;
        }

        #bgboard {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 800px;
            width: 496px;
        }

        #board {
            width: calc((var(--piece-count-width)) * var(--piece-size) * (1 + var(--in-debug-mode)));
            height: calc((var(--piece-count-height)) * var(--piece-size));
            border: 5px solid black;
            position: absolute;
            overflow: hidden;
        }

        .board>div {
            position: absolute;
            top: 50px;
            left: calc((var(--piece-count-height)) * var(--piece-size));
            background-color: burlywood;
            width: 100px;
            height: 100px;
            border: 2px solid black;
        }

        .board>.y0 {
            top: 0;
        }

        .board>.y1 {
            top: calc(var(--piece-size));
        }

        .board>.y2 {
            top: calc(var(--piece-size) * 2);
        }

        .board>.y3 {
            top: calc(var(--piece-size) * 3);
        }

        .board>.y4 {
            top: calc(var(--piece-size) * 4);
        }

        .board>.y5 {
            top: calc(var(--piece-size) * 5);
        }

        .board>.y6 {
            top: calc(var(--piece-size) * 6);
        }

        .board>.y7 {
            top: calc(var(--piece-size) * 7);
        }

        .board>.y8 {
            top: calc(var(--piece-size) * 8);
        }

        .board>.x0 {
            left: 0;
        }

        .board>.x1 {
            left: calc(var(--piece-size));
        }

        .board>.x2 {
            left: calc(var(--piece-size) * 2);
        }

        .board>.x3 {
            left: calc(var(--piece-size) * 3);
        }

        .board>.x4 {
            left: calc(var(--piece-size) * 4);
        }

        .board>.x5 {
            left: calc(var(--piece-size) * 5);
        }

        .board>.x6 {
            left: calc(var(--piece-size) * 6);
        }

        .board>.x7 {
            left: calc(var(--piece-size) * 7);
        }

        .board>.x8 {
            left: calc(var(--piece-size) * 8);
        }

        .board>.w1 {
            width: calc(var(--piece-size) - 2px);
        }

        .board>.w2 {
            width: calc(var(--piece-size) * 2 - 2px);
        }

        .board>.h1 {
            height: calc(var(--piece-size) - 2px);
        }

        .board>.h2 {
            height: calc(var(--piece-size) * 2 - 2px);
        }

        .PopUp {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .popupContainer {
            background-color: white;
            width: 200px;
            height: 160px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div id="game">
        <div id="bgboard" class="bgboard" style="background-image: url(../image/board.png);background-size: cover;">
            <div id="board" class="board"></div>
            <!-- <button id="L">←</button>
            <button id="R">→</button>
            <button id="U">↑</button>
            <button id="D">↓</button> -->
            <div id="stepcount" style="position: absolute;top: 0;width: 50px;"></div>
            <div id="timer" style="position: absolute;top: 10px;width: 50px;"></div>
            <div id="buttoncontainer" style="position: absolute; bottom: 0;flex-direction: column;">
                <button class="homeButton" id="home">Home</button>
                <button class="levelButton" id="level">Level</button>
                <button id="back">Back</button>
            </div>
        </div>
    </div>
    <div id="huarongdaoPopUp" class="PopUp" style="display: none;">
        <div class="popupContainer">
            <p id="popupHuarongdaoStatus">Success!</p>
            <p id="popupHuarongdaoScore">Score: 123</p>
            <button class="retryButton">Retry</button>
            <button class="homeButton">Home</button>
            <button class="levelButton">Level</button>
        </div>
    </div>

        const BASE_URL = 'http://127.0.0.1:8080';
        /** 
        * @param {string} game
        * @param {number} [level]
        * @returns {Promise<Object>}
        */
        async function getNewGame(game, level = null) {
            let uri = `/games/${game}/new`;
            if (game === 'huarongdao' && level !== null) {
                uri += `?level=${level}`;
            }
            return await getData(uri);
        }

        /**
         * 发送用户移动操作
         * @param {string} game - 游戏名，如 "2048" 或 "huarongdao"
         * @param {string} boardJson - 当前棋盘状态（JSON 字符串）
         * @param {string} direction - 方向：U / D / L / R（或 W/A/S/D）
         * @param {number} pieceId - 棋子编号（仅部分游戏使用）
         * @returns {Promise<Object>} 返回 { boardJson, valid, success }
         */

        async function sendMove(game, boardJson, direction, pieceId) {
            return await postData(`/games/${game}/move`, {
                boardJson,
                direction,
                pieceId,
            });
        }

        async function getData(uri) {
            try {
                const response = await fetch(BASE_URL + uri);
                if (!response.ok) throw new Error('网络响应不正常');
                return await response.json();
            } catch (error) {
                console.error('获取数据失败:', error);
                throw error;
            }
        }

        async function postData(uri, params) {
            try {
                const response = await fetch(BASE_URL + uri, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(params),
                });
                if (!response.ok) throw new Error('网络响应不正常');
                return await response.json();
            } catch (error) {
                console.error('发送数据失败:', error);
                throw error;
            }
        }

                    "--piece-size": "22.5vmin",
                    "--piece-count-width": 4,
                    "--piece-count-height": 4
                },
                pieceCount: 16,
                pieceCountWidth: 4
            },
            'huarongdao': {
                attrs: {
                    "--piece-size": "18vmin",
                    "--piece-count-width": 4,
                    "--piece-count-height": 5
                },
                pieceCount: 10,
                pieceCountWidth: 4
            },
            'sudoku': {
                attrs: {
                    "--piece-size": "10vmin",
                    "--piece-count-width": 9,
                    "--piece-count-height": 9
                },
                pieceCount: 81,
                pieceCountWidth: 9
            }
        }

        let currentBoard = null;
        let pieceCount = 0;
        const pieces = [];
        const urlParams = new URLSearchParams(window.location.search);
        const level = parseInt(urlParams.get('level')) || 0;
        const game = urlParams.get('game');
        let startX = 0;
        let startY = 0;
        let isDragging = false;
        let pieceId = null;
        let pieceName = null;
        const board = document.getElementById("board");
        let attr = null;
        let steps = 0;
        let max = 0;
        let status = false;
        let timerInterval = null;
        let startTime = null;
        let isTiming = false;
        let elapsedMs = 0;
        let totalSeconds = 0;
        let minutes = 0;
        let seconds = 0;
        let formattedTime = '';

        // 改变游戏类型
        async function changeGameType(game, level) {
            if (!['2048', 'huarongdao', 'sudoku'].includes(game)) return;

            // 获取游戏数据（确保异步完成）
            currentBoard = await getNewGame(game, level);

            if (!currentBoard || !currentBoard.pieces) {
                console.error("currentBoard 加载失败：", currentBoard);

            board.innerHTML = "";
            pieces.length = 0;

            board.classList.remove('2048', 'huarongdao', 'sudoku');
            board.classList.add(game);

            const attrs = gameTypeConfig[game].attrs;
            for (const attr in attrs) {
                document.documentElement.style.setProperty(attr, attrs[attr]);
            }

            const X = gameTypeConfig[game].pieceCountWidth;
            const pieceCount = gameTypeConfig[game].pieceCount;

            printCurrentBoard(game, currentBoard)

            //     if (game !== 'huarongdao') {
            //         piece.classList.add("w1", "h1", `x${i % X}`, `y${Math.floor(i / X)}`);
            //         piece.style.backgroundImage = `url("../image/${currentBoard[i]}.png")`;
            //     }
            // }

            // if (game === 'huarongdao') {
            //     currentBoard.pieces.forEach(currentPiece => {
            //         const p = pieces[currentPiece.id];
            //         if (!p) return;

            //         p.classList.add(`x${currentPiece.x}`, `y${currentPiece.y}`, `w${currentPiece.w}`, `h${currentPiece.h}`);
            //         p.style.backgroundSize = "100% 100%";
            //         p.setAttribute("dataname", currentPiece.name)
            //         p.setAttribute("dataId", currentPiece.id)

            //         if (currentPiece.w === 1 && currentPiece.h === 2) {
            //             p.style.backgroundImage = `url("../image/${currentPiece.name}_h.png")`;
            //         } else if (currentPiece.w === 2 && currentPiece.h === 1) {
            //             p.style.backgroundImage = `url("../image/${currentPiece.name}_w.png")`;
            //         } else {
            //             p.style.backgroundImage = `url("../image/${currentPiece.name}.png")`;
            //         }



            // p.addEventListener("click", function () {
            //     activePiece = this;
            // })
            // });

            // };
        }

        function printCurrentBoard(game, currentBoard) {
            board.innerHTML = "";
            pieces.length = 0;

            const pieceCount = gameTypeConfig[game].pieceCount;
            const X = gameTypeConfig[game].pieceCountWidth;

            for (let i = 0; i < pieceCount; i++) {
                const piece = document.createElement("div");
                piece.classList.add("piece");
                board.appendChild(piece);
                pieces.push(piece);

                if (game !== 'huarongdao') {
                    currentState = currentBoard.cells
                    piece.classList.forEach(cls => {
                        if (/^[xywh][0-9]+$/.test(cls)) {
                            piece.classList.remove(cls);
                        }
                    });
                    piece.classList.add("w1", "h1", `x${i % X}`, `y${Math.floor(i / X)}`);
                    piece.style.backgroundImage = `url("../image/${currentState[Math.floor(i / X)][i % X]}.png")`;
                    piece.style.backgroundSize = "100% 100%";
                }
            }

            if (game === 'huarongdao') {
                currentBoard.pieces.forEach(currentPiece => {
                    const p = pieces[currentPiece.id];
                    if (!p) return;

                    p.classList.forEach(cls => {
                        if (/^[xywh][0-9]+$/.test(cls)) {
                            p.classList.remove(cls);
                        }
                    });

                    p.classList.add(`x${currentPiece.x}`, `y${currentPiece.y}`, `w${currentPiece.w}`, `h${currentPiece.h}`);
                    p.style.backgroundSize = "100% 100%";
                    p.setAttribute("dataname", currentPiece.name);
                    p.setAttribute("dataId", currentPiece.id);

                    if (currentPiece.w === 1 && currentPiece.h === 2) {
                        p.style.backgroundImage = `url("../image/${currentPiece.name}_h.png")`;
                    } else if (currentPiece.w === 2 && currentPiece.h === 1) {
                        p.style.backgroundImage = `url("../image/${currentPiece.name}_w.png")`;
                    } else {
                        p.style.backgroundImage = `url("../image/${currentPiece.name}.png")`;
                    }

                    p.addEventListener("mousedown", function (e) {
                        console.log("mousedown at", e.clientX, e.clientY)
                        e.preventDefault(); // 防止图片拖动
                        startX = e.clientX;
                        startY = e.clientY;
                        isDragging = true;
                        activePiece = this;
                    });

                    // p.addEventListener("click", function () {
                    //     pieceName = p.getAttribute("dataname");
                    //     pieceId = p.getAttribute("dataId");
                    // });
                });
            }
        }


        //获取初始局面
        (async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const level = parseInt(urlParams.get('level')) || 0;
            const game = urlParams.get('game');
            document.getElementById("back").style.display = (game === "huarongdao") ? "block" : "none";
            document.getElementById("level").style.display = (game === "huarongdao") ? "block" : "none";
            await changeGameType(game, level);
            timeStart();
        })();

        if (game !== "huarongdao") {
            document.addEventListener("mousedown", function (e) {
                console.log("mousedown at", e.clientX, e.clientY)
                e.preventDefault();
                startX = e.clientX;
                startY = e.clientY;
                isDragging = true;
            })
        }
        document.addEventListener("mouseup", function (e) {
            console.log("mouseup at", e.clientX, e.clientY)
            if (!isDragging) return;
            if (game === "huarongdao") {
                if (!activePiece) return;
            }

            const endX = e.clientX;
            const endY = e.clientY;

            const deltaX = endX - startX;
            const deltaY = endY - startY;

            const threshold = 10;
            let direction = "";

            if (Math.abs(deltaX) < threshold && Math.abs(deltaY) < threshold) {
                direction = "Click (no move)";
            } else if (Math.abs(deltaX) > Math.abs(deltaY)) {
                direction = deltaX > 0 ? "R" : "L";
            } else {
                direction = deltaY > 0 ? "D" : "U";
            }
            if (game === "huarongdao") {
                pieceName = activePiece.getAttribute("dataname");
                pieceId = activePiece.getAttribute("dataId");
            }
            console.log(pieceName, direction);

            onClickMove(direction);

            if (status) {
                console.log("Success!");
                if (game === "huarongdao") {
                    timeStop();
                    showHuarongdaoPopup(steps, formattedTime);
                }
            }

            isDragging = false;
            activePiece = null;
        });

        // document.getElementById("L").addEventListener("click", onClickMove("L"))

        function onClickMove(dir) {
            direction = dir;
            console.log(game, pieceName, direction)
            sendMove(game, JSON.stringify(currentBoard), direction, pieceId)
                .then(result => {
                    if (result.valid) {
                        currentBoard = JSON.parse(result.boardJson);
                        console.log(currentBoard);
                        printCurrentBoard(game, currentBoard);
                        status = result.success
                        console.log("status: ", status)
                        if (game === "huarongdao") {
                            steps = steps + 1;
                            document.getElementById("stepcount").textContent = `Step: ${steps}`;
                        }
                        if (game === "2048") {
                            max = Math.max(...currentBoard.cells.flat());
                            document.getElementById("stepcount").textContent = `LargestNumber: ${max}`
                        }
                    }
                })
        }

        document.getElementById("back").addEventListener("click", () => {
            sendMove(game, JSON.stringify(currentBoard), "B", pieceId)
                .then(result => {
                    if (result.valid) {
                        currentBoard = JSON.parse(result.boardJson);
                        console.log(currentBoard);
                        printCurrentBoard(game, currentBoard);
                        steps = steps - 1;
                        document.getElementById("stepcount").textContent = `Step: ${steps}`;
                    }
                })
        })

        document.querySelectorAll(".levelButton").forEach(button => {
            button.addEventListener("click", () => {
                window.location.href = "huarongdao_level.html";
            });
        });

        document.querySelectorAll(".homeButton").forEach(button => {
            button.addEventListener("click", () => {
                window.location.href = "../frontpage.html";
            });
        });

        document.querySelectorAll(".retryButton").forEach(button => {
            button.addEventListener("click", () => {
                window.location.href = `huarongdao2.0.html?level=${level}&game=${game}`;
            });
        });

        //             console.log(game, pieceName, direction)
        //             sendMove(game, JSON.stringify(currentBoard), direction, pieceId)
        //                 .then(result => {
        //                     if (result.valid) {
        //                         currentBoard = JSON.parse(result.boardJson);
        //                         console.log(currentBoard);
        //                         printCurrentBoard(game, currentBoard);
        //                     }
        //                 })
        //         })

        //             direction = "D";
        //             console.log(game, pieceName, direction)
        //             sendMove(game, JSON.stringify(currentBoard), direction, pieceId)
        //                 .then(result => {

        //                         currentBoard = JSON.parse(result.boardJson);
        //                         console.log(currentBoard);
        //                         printCurrentBoard(game, currentBoard);
        //                     }
        //                 })
        //         })

        function showHuarongdaoPopup(steps, time) {
            document.getElementById("popupHuarongdaoScore").textContent = `Step: ${steps} Time: ${time} Score: ${1000 - steps * totalSeconds}`;
            document.getElementById("huarongdaoPopUp").style.display = "flex";
        }

        function show2048Popup(score) {
            document.getElementById("popup2048Status").textContent = `${status}`
            document.getElementById("popup2048Score").textContent = `Largest Number: ${max}`;
            document.getElementById("2048PopUp").style.display = "flex";
        }

        function timeStart() {
            if (!isTiming) {
                startTime = Date.now();
                timerInterval = setInterval(timeUpdate, 100);
                isTiming = true;
            }
        }

        function timeUpdate() {
            elapsedMs = Date.now() - startTime;
            totalSeconds = Math.floor(elapsedMs / 1000);
            minutes = Math.floor(totalSeconds / 60);
            seconds = totalSeconds % 60;
            formattedTime = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            document.getElementById("timer").innerText = `Time: ${formattedTime}`;
        }


        function timeStop() {
            if (isTiming) {
                clearInterval(timerInterval);
                isTiming = false;
            }
        }
    </script>

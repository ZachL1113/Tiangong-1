<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="../css/huarongdao_sliding_styles.css">
  <script type="module" src="../js/backend.js"></script>
  <script type="module" src="../js/huarongdao_sliding.js"></script>
  <script type="module" src="../js/huarongdao_printing.js"></script>
</head>
<body>
  <div class="board" id="board"></div>
  <div id="Direction" style="margin-top: 10px;"></div>
  <script>
    let startX = 0;
    let startY = 0;
    let isDragging = false;
    let activePieceId = null;
    let currentBoard = null;

    const urlParams = new URLSearchParams(window.location.search);
    const level = parseInt(urlParams.get('level')) || 0;

    getNewGame('huarongdao', level).then(data => {
      currentBoard = data;
      huarongdao_print(data);
      huarongdao_slide();
});
  </script>
</body>
</html>

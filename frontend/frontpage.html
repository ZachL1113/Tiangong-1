<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/frontpage_styles.css">
</head>

<body>
    <div class="board">
        <div class="name">
            <h1>Welcome to Board King!</h1>
        </div>
        <div class="buttoncontainer">
            <button id="huarongdao">Huarongdao</button>
            <button id="2048">2048</button>
            <button id="snake">snake</button>
            <button id="ranking">Ranking</button>
            <button id="profile">Profile</button>
        </div>
        <script>
            const BASE_URL = 'http://127.0.0.1:8080';
            /** 
            * @param {string} game
            * @param {number} [level]
            * @returns {Promise<Object>}
            */

            async function getLeaderboard(game) {
                const res = await fetch(`${BASE_URL}/leaderboard?game=${encodeURIComponent(game)}`);
                if (!res.ok) throw new Error("Leaderboard fetch failed");
                return await res.json();
            }

            async function getPlayerScores(playerId) {
                const res = await fetch(`${BASE_URL}/players/${encodeURIComponent(playerId)}/scores`);
                if (!res.ok) throw new Error("Player scores fetch failed");
                return await res.json();
            }

            async function getPlayerRank(playerId, game) {
                const res = await fetch(`${BASE_URL}/players/${encodeURIComponent(playerId)}/leaderboard-rank?game=${encodeURIComponent(game)}`);
                if (!res.ok) throw new Error("Player rank fetch failed");
                return await res.json();
            }

            async function getHistoryScore(historyId) {
                const res = await fetch(`${BASE_URL}/history/${encodeURIComponent(historyId)}`);
                if (!res.ok) throw new Error("History fetch failed");
                return await res.json();
            }

            document.getElementById("huarongdao").addEventListener("click", () => {
                window.location.href = `huarongdao/huarongdao_level.html`;
            });
            document.getElementById("2048").addEventListener("click", () => {
                window.location.href = `huarongdao/huarongdao2.0.html?game=2048`;
            });
            document.getElementById("snake").addEventListener("click", () => {
                window.location.href = `huarongdao/huarongdao2.0.html?game=snake`;
            });

            document.getElementById("ranking").addEventListener("click", async () => {
                window.location.href = `ranking/ranking.html`;
            });

            document.getElementById("profile").addEventListener("click", async () => {
                window.location.href = `profile/profile.html`;
            });
        </script>
    </div>
</body>

</html>

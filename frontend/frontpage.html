<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Board King</title>
    <link rel="stylesheet" href="css/frontpage_styles.css">
</head>

<body>
    <div class="board">
        <div class="name">
            <h1>Welcome to Board King!</h1>
        </div>
        <div class="buttoncontainer">
            <button id="huarongdao">Huarongdao</button>
            <button id="2048">2048</button>
            <!-- <button id="snake">Snake</button> -->
            <button id="ranking">Ranking</button>
            <button id="profile">Profile</button>
        </div>
    </div>

    <script>
        const BASE_URL = '';

        // 保存玩家信息到本地
        function savePlayerLocally(player) {
            localStorage.setItem("player", JSON.stringify(player));
        }

        function loadPlayerFromLocal() {
            const data = localStorage.getItem("player");
            return data ? JSON.parse(data) : null;
        }

        // 尝试从 /api/me 获取登录用户
        async function fetchCurrentUser() {
            try {
                const res = await fetch(`${BASE_URL}/api/me`, { credentials: 'include' });
                if (!res.ok) throw new Error("Not logged in");
                const player = await res.json();
                if (player && player.id) {
                    savePlayerLocally(player);
                } else {
                    throw new Error("No valid player data");
                }
            } catch (e) {
                console.warn("No OAuth user found, redirecting to login.");
                window.location.href = "login.html";
            }
        }

        // 页面加载时获取当前用户
        window.addEventListener("DOMContentLoaded", async () => {
            const localPlayer = loadPlayerFromLocal();
            if (!localPlayer) {
                await fetchCurrentUser();
            }
        });

        // 按钮跳转逻辑
        document.getElementById("huarongdao").addEventListener("click", () => {
            window.location.href = `huarongdao/huarongdao_level.html`;
        });
        document.getElementById("2048").addEventListener("click", () => {
            window.location.href = `huarongdao/huarongdao2.0.html?game=2048`;
        });
        // document.getElementById("snake").addEventListener("click", () => {
        //     window.location.href = `huarongdao/huarongdao2.0.html?game=snake`;
        // });
        document.getElementById("ranking").addEventListener("click", () => {
            window.location.href = `ranking/ranking.html`;
        });
        document.getElementById("profile").addEventListener("click", () => {
            window.location.href = `profile/profile.html`;
        });
    </script>
</body>

</html>

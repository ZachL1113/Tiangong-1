<!DOCTYPE html>
<html>

<head>
    <title>Login - Board King</title>
    <style>
        body {
            background: #f0f0f0;
            text-align: center;
            padding-top: 10vh;
        }

        .login-box {
            background: white;
            display: inline-block;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        input,
        button {
            font-size: 1rem;
            padding: 0.5rem;
            margin: 0.5rem;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h1>WELCOME TO Board King!</h1>
        <p>Please enter name: </p>
        <input type="text" id="nameInput" placeholder="Your Name">
        <br>
        <button onclick="createNewPlayer()">START GAME</button>

        <hr>
        <p>OR log in by: </p>
        <a href="http://127.0.0.1:8080/oauth2/authorization/google">
            <button>Google</button>
        </a>
    </div>

    <script>
        function savePlayerLocally(player) {
            localStorage.setItem("player", JSON.stringify(player));
        }

        function loadPlayerFromLocal() {
            const data = localStorage.getItem("player");
            return data ? JSON.parse(data) : null;
        }

        async function autoLoginIfOAuthAuthenticated() {
            const localPlayer = loadPlayerFromLocal();
            if (localPlayer) return;

            try {
                const res = await fetch("http://127.0.0.1:8080/api/me");
                if (res.ok) {
                    const player = await res.json();
                    if (player && player.name) {
                        savePlayerLocally(player);
                        window.location.href = "frontpage.html";
                    }
                }
            } catch (e) {
                console.warn("OAuth automatically log in failed", e);
            }
        }

        async function createNewPlayer() {
            const name = document.getElementById("nameInput").value.trim();
            if (!name) {
                alert("Please enter name");
                return;
            }

            try {
                const res = await fetch("http://127.0.0.1:8080/players", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ name })
                });
                if (res.ok) {
                    const player = await res.json();
                    savePlayerLocally(player);
                    window.location.href = "frontpage.html";
                } else {
                    alert("create new player failed");
                }
            } catch (e) {
                alert("network error");
                console.error(e);
            }
        }

        window.onload = autoLoginIfOAuthAuthenticated;
    </script>
</body>

</html>

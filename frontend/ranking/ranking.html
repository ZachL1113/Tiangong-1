<!DOCTYPE html>
<html lang="en">

<head>
    <title>Leaderboard</title>
    <style>
        body {
            background: #f0f2f5;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        th,
        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ccc;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        select {
            display: block;
            margin: 0 auto 20px auto;
            padding: 8px;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <h1>Game Leaderboard</h1>

    <select id="gameSelect">
        <option value="2048">2048</option>
        <option value="huarongdao">huarongdao</option>
    </select>

    <table id="leaderboardTable">
        <thead>
            <tr>
                <th>Rank</th>
                <th>Player</th>
                <th>Score</th>
            </tr>
        </thead>
        <tbody>
            <!-- Data will be inserted here -->
        </tbody>
    </table>

    <script>
        const tableBody = document.querySelector("#leaderboardTable tbody");
        const gameSelect = document.getElementById("gameSelect");

        async function fetchLeaderboard(game) {
            const response = await fetch(`http://127.0.0.1:8080/leaderboard?game=${game}`);
            if (!response.ok) {
                tableBody.innerHTML = `<tr><td colspan="3">Failed to load leaderboard.</td></tr>`;
                return;
            }

            const data = await response.json();
            tableBody.innerHTML = "";

            if (data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="3">No data available.</td></tr>`;
                return;
            }

            data.forEach((entry, index) => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${entry.player.name || "Unknown"}</td>
                    <td>${entry.score}</td>
                `;
                tableBody.appendChild(row);
            });
        }

        gameSelect.addEventListener("change", () => {
            fetchLeaderboard(gameSelect.value);
        });

        // Load default leaderboard on page load
        fetchLeaderboard(gameSelect.value);
    </script>

</body>

</html>
